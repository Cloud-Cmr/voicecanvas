name: Build & Release

# 触发方式：
#   1. 打 tag 并推送（如 git tag v0.1.0 && git push origin v0.1.0）→ 构建 + 发布 Release
#   2. 在 Actions 页面手动点 "Run workflow" → 只构建，产物留在 Artifacts 里
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 打 tag 发布需要写 Release 的权限；其余情况只读
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows 打包
    runs-on: windows-latest

    env:
      # 国内网络下 Electron 二进制下载很慢，取消下面一行的注释可切换到国内镜像。
      # 注意：CI 在 GitHub 的境外机器上运行，用镜像反而可能更慢，默认不开。
      # ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      #
      # electron-builder 下载 NSIS 等工具链同样走 GitHub，如需国内加速可以再加：
      # ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      #
      # 关闭 electron-builder 的自动代码签名探测（CI 环境没有证书，探测会报错中断）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      # 类型检查不阻断发布：文档/示例代码可能尚未完全对齐，
      # 失败时只留一条警告，正式版仍会继续打包。
      - name: 类型检查（允许失败）
        run: npm run typecheck
        continue-on-error: true

      - name: 构建并打包 Windows 产物
        run: npm run dist:win

      - name: 列出产物（便于排查路径问题）
        shell: pwsh
        run: |
          Write-Host '===== dist ====='
          if (Test-Path dist) { Get-ChildItem -Recurse dist | Select-Object FullName, Length } else { Write-Host 'dist 不存在' }
          Write-Host '===== release ====='
          if (Test-Path release) { Get-ChildItem -Recurse release | Select-Object FullName, Length } else { Write-Host 'release 不存在' }

      # electron-builder 默认输出到 dist/；若 package.json 里配了
      # build.directories.output = "release"，产物就在 release/。两个路径都收。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: voicecanvas-windows-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 14

      # 只在推送 v* tag 时发布；workflow_dispatch 手动运行不会创建 Release。
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 使用仓库自带的 GITHUB_TOKEN，不需要在仓库里配置任何密钥。
          # 触发流程：Settings → Actions → General → Workflow permissions
          # 选择 "Read and write permissions"。
          token: ${{ secrets.GITHUB_TOKEN }}
          name: VoiceCanvas ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 声绘 VoiceCanvas ${{ github.ref_name }}

            Windows 安装包见下方 Assets。

            > ⚠️ 本项目是第三方非官方客户端，与小米公司无隶属关系。
            > 语音合成服务由小米 MiMo 开放平台提供，需要自备 API Key。

            安装后首次启动会引导你配置 API Key，详见 README 的「获取 API Key」一节。
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            release/*.exe
            release/*.blockmap
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
